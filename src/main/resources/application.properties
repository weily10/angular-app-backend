# Application Name
spring.application.name=angular-app-backend

# Server Port (Render injects $PORT dynamically)
server.port=${PORT:8080}

# Security & Secret Key Injection
application.security.jwt.secret-key=${JWT_SECRET_KEY}

# Database Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# Production Logging Levels (INFO or WARN only)
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.mongodb.driver=WARN

# Security: Hide stack traces and server info on error responses
server.error.include-stacktrace=never
server.error.include-message=never